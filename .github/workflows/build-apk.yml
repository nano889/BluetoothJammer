name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          ls "$SDK_ROOT" || true

      - name: Install required SDK packages
        run: |
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Locate and verify APK
        run: |
          echo "=== APK files ==="
          find . -name "*.apk" -type f -exec ls -l {} \;
          APK="$(find . -name '*.apk' -type f | head -1)"
          if [ -z "$APK" ]; then echo "NO APK PRODUCED"; exit 1; fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "=== SHA-256 ==="
          sha256sum "$APK"
          echo "=== size ==="
          stat -c '%s bytes' "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluetoothjammer-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 90
